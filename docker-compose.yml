# Sobe a loja completa (aplicação + PostgreSQL) com um comando:
#   docker compose up --build
# Depois abra http://localhost:8080 (admin: admin@clouud.com / Admin@123).
# Os e-mails da loja caem no Mailpit, uma caixa de entrada de teste: http://localhost:8025
# O banco fica dentro do Docker (não usa nem ocupa a porta 5432 do seu computador).
#
# Senhas: vêm de variáveis de ambiente ou de um arquivo .env nesta pasta (modelo em .env.example).
# Sem .env, valem os valores de exemplo abaixo, bons só para testar no seu computador.

name: clouud

services:
  banco:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${BANCO_SENHA:-postgres}
      POSTGRES_DB: lojajogos
    volumes:
      - banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lojajogos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Caixa de entrada de teste: recebe todos os e-mails da loja (nenhum sai para a internet)
  mailpit:
    image: axllent/mailpit:latest
    ports:
      # Só neste computador: a caixa de teste não tem senha e mostra links de senha e chaves
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  app:
    build: .
    depends_on:
      banco:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ConnectionStrings__LojaJogos: "Host=banco;Port=5432;Database=lojajogos;Username=postgres"
      Banco__Senha: ${BANCO_SENHA:-postgres}
      # Cria/atualiza as tabelas ao iniciar (no dia a dia, fora do Docker, continua sendo "dotnet ef database update")
      Banco__AplicarMigrations: "true"
      # Primeiro administrador (criado só se ainda não existir nenhum). Troque a senha depois de entrar.
      AdminInicial__Email: "admin@clouud.com"
      AdminInicial__Senha: ${ADMIN_SENHA:-Admin@123}
      # Chave que cifra os códigos das chaves de ativação no banco. O valor padrão é público (está no Git):
      # serve só para testar. Para uso de verdade, gere a sua (openssl rand -base64 32) e guarde uma cópia.
      Seguranca__ChaveCriptografia: ${CHAVE_CRIPTOGRAFIA:-q9Zq0X0aD8l7cO3a7nqV2mYkP9w6p5T1eJrX0sQw3Zg=}
      TZ: "America/Sao_Paulo"
      # Aqui a loja roda em HTTP puro, no seu computador. Em produção, coloque um proxy com certificado
      # (nginx, Traefik, Caddy...) na frente, troque para "true" e ligue Seguranca__Proxy__Confiar.
      Seguranca__Https__Forcar: "false"
      # Pagamento de mentira (botões "aprovar"/"recusar"), para testar a loja. Em produção sem operadora de
      # pagamento, deixe "false": senão qualquer cliente "aprova" o próprio pedido e leva as chaves.
      Pagamento__Simulado: "true"
      # Links dos e-mails (confirmação, senha) apontam para cá
      Loja__UrlPublica: "http://localhost:8080"
      Email__Modo: "Smtp"
      Email__Smtp__Host: "mailpit"
      Email__Smtp__Porta: "1025"
      Email__Smtp__Ssl: "false"
      # Menos texto no log (sem cada comando SQL)
      Logging__LogLevel__Microsoft.EntityFrameworkCore: "Warning"
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/wwwroot/uploads
      - chaves-login:/home/app/.aspnet/DataProtection-Keys
    restart: unless-stopped

volumes:
  banco:
  uploads:
  chaves-login:
