name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Um push novo na mesma branch cancela a execução anterior que ainda estiver rodando
# O CI só lê o código (sem permissão de escrita no repositório)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Build e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CLOUUD_PG_HOST: localhost
      CLOUUD_PG_PORTA: 5432
      CLOUUD_PG_USUARIO: postgres
      CLOUUD_PG_SENHA: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET (versão do global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar pacotes e ferramentas
        run: |
          dotnet restore
          dotnet tool restore

      - name: Compilar
        run: dotnet build --configuration Release --no-restore

      - name: Conferir pacotes com vulnerabilidade conhecida
        run: |
          dotnet list package --vulnerable --include-transitive | tee pacotes.txt
          if grep -q "has the following vulnerable packages" pacotes.txt; then
            echo "::error::Há pacotes NuGet com vulnerabilidade conhecida (veja acima)."
            exit 1
          fi

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt

      - name: Instalar dependências dos testes
        run: |
          pip install -r tests/e2e/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Rodar os testes
        run: python -m pytest tests/e2e

      - name: Guardar log da aplicação e capturas de tela
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-dos-testes
          # só o log e as capturas de tela: os e-mails de teste têm links de senha e chaves
          path: |
            tests/e2e/.saida/*.log
            tests/e2e/.saida/falhas/
          if-no-files-found: ignore
          retention-days: 7
